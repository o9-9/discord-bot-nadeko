waifu:
  desc: See waifu or hubby information.
  ex:
    - '@cutewaifu'
    - ''
  params:
    - user:
        desc: The user whose waifu info you want to see
gift:
  desc: Give a gift to a waifu or hubby
  ex:
    - 'potato @mywaifu'
  params:
    - user:
        desc: Waifu or hubby who will receive the gift.
hug:
  desc: Send a hug to waifu or hubby improving the mood.
  ex:
    - '@mywaifu'
  params:
    - user:
        desc: Waifu or hubby whose mood you want to improve.
pat:
  desc: Kiss a waifu or hubby improving the mood.
  ex:
    - '@mywaifu'
  params:
    - user:
        desc: Waifu or hubby whose mood you want to improve.
kiss:
  desc: Kiss a waifu or hubby improving the mood.
  ex:
    - '@mywaifu'
  params:
    - user:
        desc: Waifu or hubby whose mood you want to improve.